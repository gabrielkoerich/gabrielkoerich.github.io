name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page-url }}
    env:
      REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch repos
        if: ${{ env.REPOS_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.REPOS_TOKEN }}
        run: python3 scripts/fetch-repos.py

      - name: Skip repo refresh (REPOS_TOKEN missing)
        if: ${{ env.REPOS_TOKEN == '' }}
        run: echo "REPOS_TOKEN is not configured. Skipping repo metadata refresh."

      - name: Build, deploy and purge the Cloudflare cache
        id: deployment
        uses: gabrielkoerich/zola-docs-action@v1
        with:
          zola-version: "0.19.2"
          deploy: "true"
          cloudflare-token: ${{ secrets.CF_API_TOKEN }}
