name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch repos
        if: ${{ env.REPOS_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.REPOS_TOKEN }}
        run: python3 scripts/fetch-repos.py

      - name: Skip repo refresh (REPOS_TOKEN missing)
        if: ${{ env.REPOS_TOKEN == '' }}
        run: echo "REPOS_TOKEN is not configured. Skipping repo metadata refresh."

      - name: Build with the zola-docs theme
        uses: gabrielkoerich/zola-docs-action@v1
        with:
          zola-version: "0.19.2"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::warning::CF_API_TOKEN is not set, Cloudflare cache was not purged"
            exit 0
          fi
          response=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/b4f279fbdc18c1d62d60751dcefbc03e/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$response"
          echo "$response" | grep -q '"success":true' || echo "::warning::Cloudflare cache purge failed"
